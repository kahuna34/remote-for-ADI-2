name: Windows-Host bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Pakete holen
        run: |
          flutter pub get
          cd host
          flutter pub get

      - name: Analyse und Tests App
        run: |
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit 1 }
          flutter test

      - name: Tests Host
        working-directory: host
        run: |
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit 1 }
          flutter test

      - name: Host bauen
        working-directory: host
        run: flutter build windows --release

      - name: MIDI-Hilfsprogramm bauen und testen
        shell: pwsh
        run: |
          $dart = "$env:FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart.exe"
          $helper = "host/build/windows/x64/runner/Release/adi2_midi.exe"
          & $dart analyze host/tool
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $dart compile exe --packages=host/.dart_tool/package_config.json host/tool/adi2_midi_helper.dart -o $helper
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $listing = & $helper list
          if ($LASTEXITCODE -ne 0) { throw "MIDI list failed" }
          $ports = $listing | ConvertFrom-Json -ErrorAction Stop
          if ($null -eq $ports.inputs -or $null -eq $ports.outputs) {
            throw "MIDI list must contain input and output arrays"
          }
          foreach ($port in @($ports.inputs) + @($ports.outputs)) {
            if ($null -eq $port.id -or $port.name -isnot [string]) {
              throw "Invalid MIDI port in list"
            }
          }
          Write-Host "WinMM list OK: $(@($ports.inputs).Count) inputs, $(@($ports.outputs).Count) outputs"

      - name: ZIP mit Visual-C++-Laufzeit packen
        shell: pwsh
        run: |
          $src = "host/build/windows/x64/runner/Release"
          $dst = "dist/Remote for ADI-2 Host"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src/*" $dst -Recurse
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "C:/Windows/System32/$dll" $dst
          }
          Compress-Archive -Path $dst -DestinationPath "dist/Remote-for-ADI-2-Host-Windows-x64.zip"

      - name: Windows-Setup bauen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $pubspec = Get-Content host/pubspec.yaml -Raw
          $version = [regex]::Match($pubspec, '(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$')
          if (-not $version.Success) { throw "Host-Version fehlt in host/pubspec.yaml" }
          $displayVersion = "$($version.Groups[1].Value) ($($version.Groups[2].Value))"
          $fileVersion = "$($version.Groups[1].Value).$($version.Groups[2].Value)"
          & $iscc "/DHostVersion=$displayVersion" "/DHostFileVersion=$fileVersion" tools/windows/installer/host.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Stille Installation und Deinstallation testen
        shell: pwsh
        run: ./tools/windows/installer/test-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Remote-for-ADI-2-Host-Windows-Setup
          path: dist/Remote-for-ADI-2-Host-Windows-Setup.exe
          if-no-files-found: error

      - name: Diagnosetool testen und packen
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows/diagnose.ps1 -NoOpen
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path tools/windows/Diagnose.cmd, tools/windows/diagnose.ps1 -DestinationPath "dist/Remote-for-ADI-2-Windows-Diagnose.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Remote-for-ADI-2-Windows-Diagnose
          path: dist/Remote-for-ADI-2-Windows-Diagnose.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Remote-for-ADI-2-Host-Windows-x64
          path: dist/Remote-for-ADI-2-Host-Windows-x64.zip
          if-no-files-found: error
